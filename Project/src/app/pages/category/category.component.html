<div class="container-fluid p-4 category-page">

  <!-- Header Section -->
  <div class="d-flex justify-content-between align-items-center mb-4">
    <h3 class="fw-bold title">
      <i class="bi bi-grid me-2 text-primary"></i>Categories
    </h3>

    <button class="btn btn-add px-4"
        data-bs-toggle="modal"
        data-bs-target="#categoryModal"
        (click)="addButton()">
      <i class="bi bi-plus-circle me-2"></i> Add Category
    </button>
  </div>

  <!-- Search Section -->
  <div class="search-box mb-4">
    <div class="input-group">
      <span class="input-group-text">
        <i class="bi bi-search"></i>
      </span>
      <input type="text"
             class="form-control"
             [(ngModel)]="searchText"
             (input)="searchDetails()"
             placeholder="Search category name...">
    </div>
  </div>

  <!-- Table Section -->
  <div class="table-card">
    <table class="table align-middle mb-0">
      <thead>
        <tr>
          <th>Sr. No</th>
          <th>Category Name</th>
          <th class="text-end">Actions</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let item of categoryResponseList; let i=index">
          <td>{{i+1}}</td>
          <td class="fw-semibold">{{item.category_name}}</td>
          <td class="text-end">
            <button class="btn btn-sm btn-edit me-2"
                    data-bs-toggle="modal"
                    data-bs-target="#categoryModal"
                    (click)="updatedetails(item)"
                    title="Edit category">
              <i class="bi bi-pencil"></i>
            </button>
            <button class="btn btn-sm btn-delete"
                    data-bs-toggle="modal"
                    data-bs-target="#deleteModal"
                    (click)="deleteCategory(item)"
                    title="Delete category">
              <i class="bi bi-trash"></i>
            </button>
          </td>
        </tr>
      </tbody>
    </table>
  </div>

</div>

<!-- Add/Edit Category Modal -->
<div class="modal fade" id="categoryModal" tabindex="-1">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content modal-theme">
      <div class="modal-header border-0">
        <h5 class="fw-bold">{{isEdit ? 'Add Category' : 'Update Category'}}</h5>
        <button class="btn-close" data-bs-dismiss="modal"></button>
      </div>

      <div class="modal-body">
        <form [formGroup]="categoryForm">
          <div class="mb-3">
            <label class="form-label small fw-bold text-muted">CATEGORY NAME</label>
            <input type="text"
                   class="form-control form-control-theme"
                   formControlName="category_name"
                   placeholder="e.g. Electronics">
            <div class="error-message"
                 *ngIf="categoryForm.get('category_name')?.touched && categoryForm.get('category_name')?.invalid && categoryForm.get('category_name')?.hasError('required')">
              <i class="bi bi-exclamation-circle me-1"></i>Name is required.
            </div>
          </div>

          <div class="row g-2 mt-3">
            <div class="col-6">
              <button class="btn btn-light w-100 py-2" data-bs-dismiss="modal">
                <i class="bi bi-x-circle me-2"></i>Cancel
              </button>
            </div>
            <div class="col-6">
              <button class="btn btn-theme w-100 py-2" (click)="isEdit ? addCategory() : updateData()">
                <i class="bi bi-check-circle me-2"></i>{{isEdit ? 'Save' : 'Update'}}
              </button>
            </div>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>

<!-- Delete Confirmation Modal -->
<div class="modal fade" id="deleteModal" tabindex="-1">
  <div class="modal-dialog modal-sm modal-dialog-centered">
    <div class="modal-content delete-modal text-center p-4">
      <div class="text-danger mb-3">
        <i class="bi bi-exclamation-triangle-fill display-4"></i>
      </div>
      <h5 class="fw-bold">Confirm Delete</h5>
      <p class="text-muted">Are you sure you want to delete this category?</p>
      <div class="d-flex gap-2">
        <button class="btn btn-light w-100" data-bs-dismiss="modal">
          <i class="bi bi-x-circle me-1"></i>No
        </button>
        <button class="btn btn-danger w-100" data-bs-dismiss="modal" (click)="confirmDelete()">
          <i class="bi bi-trash me-1"></i>Yes, Delete
        </button>
      </div>
    </div>
  </div>
</div>
