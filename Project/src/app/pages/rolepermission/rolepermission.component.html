<div class="container-fluid mt-4 p-4">

  <!-- HEADER -->
  <div class="d-flex justify-content-between align-items-center mb-4">
    <h4 class="fw-bold mb-0">
      <i class="bi bi-shield-lock me-2 text-primary"></i>Roles & Permissions
    </h4>

    <button class="btn btn-success" 
            data-bs-toggle="modal" 
            data-bs-target="#roleModal" 
            (click)="openModel()"
            title="Add new role">
      <i class="bi bi-plus-circle me-2"></i>Add Role
    </button>
  </div>

  <div class="row">
    
    <!-- ROLES SECTION -->
    <div class="col-md-4">
      <div class="card">
        <div class="card-header">
          <i class="bi bi-person-badge me-2"></i>All Roles
        </div>

        <ul class="list-group list-group-flush">
          <li class="list-group-item d-flex justify-content-between align-items-center"
              *ngFor="let role of roleResponseList"
              [class.active]="selectedRoleId === role.role_Id">

            <!-- ROLE NAME -->
            <span (click)="selectRole(role)" 
                 >
              {{role?.role_name}}
            </span>

            <!-- ACTION BUTTONS -->
            <div class="d-flex gap-1">
              <button class="btn btn-sm btn-outline-primary"
                      data-bs-toggle="modal" 
                      data-bs-target="#roleModal"
                      (click)="editRole(role)"
                      title="Edit role">
                <i class="bi bi-pencil"></i>
              </button>

              <button class="btn btn-sm btn-outline-danger"
                      (click)="openDeleteModal(role)"
                      title="Delete role">
                <i class="bi bi-trash"></i>
              </button>
            </div>

          </li>
        </ul>
      </div>
    </div>

    <!-- PERMISSIONS SECTION -->
    <div class="col-md-8">
      <div class="card">
        <div class="card-header">
          <i class="bi bi-key-fill me-2"></i>Assign Permissions
        </div>

        <div class="card-body">
          <div class="row row-cols-md-4">
            <div class="col-md-4 mb-3"
                 *ngFor="let permission of permissionsResponseList">

              <div class="form-check">
                <input type="checkbox"
                       class="form-check-input"
                       [checked]="isPermissionAssigned(permission.permission_Id)"
                       (change)="onPermissionChange(permission.permission_Id, $event)"
                       [id]="'perm_' + permission.permission_Id">

                <label class="form-check-label" 
                       [for]="'perm_' + permission.permission_Id">
                  {{permission.permission_name}}
                </label>
              </div>

            </div>
          </div>

          <!-- SAVE BUTTON -->
          <div class="mt-4 text-end">
            <button class="btn btn-success"
                    [disabled]="!selectedRoleId"
                    (click)="savePermissions()">
              <i class="bi bi-check-circle me-2"></i>Save Permissions
            </button>
          </div>

        </div>
      </div>
    </div>

  </div>

</div>

<!-- ADD/EDIT ROLE MODAL -->
<div class="modal fade" id="roleModal" tabindex="-1">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">

      <div class="modal-header">
        <h5 class="modal-title">
          <i class="bi bi-person-badge me-2"></i>{{IsEdit ? 'Edit Role' : 'Add Role'}}
        </h5>
        <button class="btn-close" data-bs-dismiss="modal"></button>
      </div>

      <div class="modal-body">
        <label class="form-label small fw-bold text-muted">ROLE NAME</label>
        <input type="text"
               class="form-control"
               [(ngModel)]="roleName"
               placeholder="Enter role name">
      </div>

      <div class="modal-footer">
        <button class="btn btn-secondary" data-bs-dismiss="modal">
          <i class="bi bi-x-circle me-2"></i>Cancel
        </button>

        <button class="btn btn-success"
                (click)="IsEdit ? updateRole() : saveRole()">
          <i class="bi bi-check-circle me-2"></i>{{IsEdit ? 'Update Role' : 'Add Role'}}
        </button>
      </div>

    </div>
  </div>
</div>

<!-- DELETE ROLE MODAL -->
<div class="modal fade" id="deleteModal" tabindex="-1">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">

      <div class="modal-header">
        <h5 class="modal-title text-danger">
          <i class="bi bi-exclamation-triangle-fill me-2"></i>Delete Role
        </h5>
        <button class="btn-close" data-bs-dismiss="modal"></button>
      </div>

      <div class="modal-body">
        <p class="mb-0">
          Are you sure you want to delete the role <strong class="text-danger">{{roleName}}</strong>?
        </p>
      </div>

      <div class="modal-footer">
        <button class="btn btn-secondary" data-bs-dismiss="modal">
          <i class="bi bi-x-circle me-2"></i>Cancel
        </button>

        <button class="btn btn-danger"
                (click)="deleteRole()">
          <i class="bi bi-trash me-2"></i>Delete
        </button>
      </div>

    </div>
  </div>
</div>
