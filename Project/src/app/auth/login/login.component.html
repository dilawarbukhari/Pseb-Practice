<div class="login-container">
  <div class="login-card">
    <div class="login-header">
      <h2>Welcome Back!</h2>
      <p>Login to your account</p>
    </div>
    <form   [formGroup] = loginForm>
      <div class="form-group floating">
            <label for="email">Email</label>
        <input
          type="email"
          id="email"
          name="email"
          placeholder=" "
          formControlName="email"
          required  
        />
        
       <div 
    class="error-message" 
    *ngIf="loginForm.get('email')?.invalid && 
           (loginForm.get('email')?.dirty || loginForm.get('email')?.touched)">
               Email is required.
       </div>
         </div>
    
    
      <div class="form-group floating">
         <label for="password">Password</label>
        <input
          type="password"
          id="password"
          name="password"
          placeholder=" "
           formControlName="password"
          required
        />
        <div 
    class="error-message" 
    *ngIf="loginForm.get('password')?.invalid && 
           (loginForm.get('password')?.dirty || loginForm.get('password')?.touched)">
    Password is required.
  </div>
      </div>

      <div class="form-group remember">
        <input type="checkbox" id="remember" />
        <label for="remember">Remember me</label>
      </div>

      <button type="submit" (click)="onLogin()">Login</button>

      <p class="signup-link">
        Don't have an account?
        <a (click)="onSignupClick()" style="cursor: pointer;">Sign Up</a>
      </p>
       <p class="signup-link">
        Forget Password
        <a routerLink="/forgotpassword">Reset Password</a>
      </p>
    </form>
  </div>
</div>

<!-- Role Selection Modal -->
<div *ngIf="showRoleSelection" class="modal-overlay" (click)="closeRoleSelection()">
  <div class="modal-content" (click)="$event.stopPropagation()">
    <div class="modal-header">
      <h3>Select Account Type</h3>
      <button class="close-btn" (click)="closeRoleSelection()">&times;</button>
    </div>
    <p class="modal-description">Choose how you'd like to join our platform</p>
    <div class="role-options">
      <div class="role-card" (click)="selectRole('buyer')">
        <div class="role-icon">👤</div>
        <h4>Buyer</h4>
        <p>Browse and purchase products</p>
      </div>
      <div class="role-card" (click)="selectRole('seller')">
        <div class="role-icon">🏪</div>
        <h4>Seller</h4>
        <p>Sell products and manage inventory</p>
      </div>
    </div>
  </div>
</div>
